name: Update ACNC register archive

on:
  schedule:
    - cron: "0 9-12 * * 1"
      timezone: "Australia/Sydney"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-acnc-register
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Download a new resource version
        run: python3 scripts/fetch_acnc_register.py

      - name: Commit and push changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source update old enough to archive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/acnc-register-of-australian-charaties
          git commit -m "Archive ACNC register $(TZ=Australia/Sydney date +%Y-%m-%d)"
          git push
